name = "hugueninfer-interview-copilot-api"
main = "src/index.ts"
compatibility_date = "2025-03-25"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[triggers]
crons = ["0 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "hugueninfer-interview-copilot-db"
# Create this database in your Cloudflare account, then replace this value.
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
migrations_dir = "drizzle"

[[kv_namespaces]]
binding = "CONFIG_KV"
# Create this namespace in your Cloudflare account, then replace this value.
id = "REPLACE_WITH_YOUR_KV_NAMESPACE_ID"

[[unsafe.bindings]]
name = "COMPLETION_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 30, period = 60 }

# Quota: record consumption in dry-run; enforcement off until billing is ready.
[vars]
QUOTA_ENFORCEMENT = "false"
QUOTA_RECORD_CONSUMPTION = "true"
